name: MTDBuddy
options:
  bundleIdPrefix: com.rexlan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  MTDBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: MTDBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexlan.mtdbuddy
        PRODUCT_NAME: MTDBuddy
        CODE_SIGN_ENTITLEMENTS: MTDBuddy/MTDBuddy.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MTD Buddy
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MTD Buddy uses your location to find the bus stops nearest you and show live bus positions relative to you."
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
    info:
      path: MTDBuddy/Info.plist
      properties:
        MTD_API_KEY: $(MTD_API_KEY)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        GOOGLE_REVERSED_CLIENT_ID: $(GOOGLE_REVERSED_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.rexlan.mtdbuddy.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: GoogleOAuth
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    dependencies:
      - target: MTDBuddyWidgetExtension
        embed: true
    entitlements:
      path: MTDBuddy/MTDBuddy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rexlan.mtdbuddy

  MTDBuddyWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: MTDBuddyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexlan.mtdbuddy.widget
        PRODUCT_NAME: MTDBuddyWidgetExtension
        CODE_SIGN_ENTITLEMENTS: MTDBuddyWidget/MTDBuddyWidget.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: MTD Buddy Widget
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
    info:
      path: MTDBuddyWidget/Info.plist
      properties:
        MTD_API_KEY: $(MTD_API_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MTDBuddyWidget/MTDBuddyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rexlan.mtdbuddy

schemes:
  MTDBuddy:
    build:
      targets:
        MTDBuddy: all
        MTDBuddyWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
